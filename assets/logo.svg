<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#0a0a2e"/>
    </linearGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bg4)"/>
  
  <!-- Code brackets + gear -->
  <g transform="translate(200,180)">
    <!-- Gear/cog -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FF0080" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#FF0080" stroke-width="3" filter="url(#glow4)"/>
    <circle cx="0" cy="0" r="8" fill="#FF0080"/>
    
    <!-- Code brackets -->
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="40" fill="#00E5FF" filter="url(#glow4)">{ }</text>
  </g>
  
  <!-- Floating code fragments -->
  <g font-family="monospace" font-size="9" fill="#788090" opacity="0.5">
    <text x="50" y="120">def agent():</text>
    <text x="50" y="135">  return swarm</text>
    <text x="280" y="280">class SDK:</text>
    <text x="280" y="295">  autonomous = True</text>
  </g>
  
  <text x="200" y="340" text-anchor="middle" font-family="Impact, sans-serif" font-size="34" fill="#00E5FF" filter="url(#glow4)">AGENT SDK</text>
  <text x="200" y="370" text-anchor="middle" font-family="monospace" font-size="10" fill="#FF0080">AUTONOMOUS AI FRAMEWORK</text>
</svg>
